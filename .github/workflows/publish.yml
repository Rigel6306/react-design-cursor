name: patch and publish to NPM

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write # Required for npm provenance / Trusted Publishers

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment: npm-publish # Must match your configured environment on npmjs.com

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build
      
      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        run: |
          npm version patch -m "chore(release): %s [skip ci]"

      - name: Push version bump & tag to GitHub first (Required for Provenance)
        run: git push --follow-tags

      - name: Publish to npm with Provenance
        run: npm publish --access public --provenance