
name : patch and publish to NPM
on :
  push:
    branches:
      - main
permissions:
    contents: write
    id-token: write

jobs:
  publish:
  #prevent loops when the bot publishes the bumped package.json
      if: github.actor != 'github-actions[bot]'
      runs-on: ubuntu-latest
      environment: npm-publish

      steps:
        - name: checkout repo
          uses: actions/checkout@v4
          with: 
            fetch-depth: 0

        - name: setup node
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            registry-url: 'https://registry.npmjs.org'
            cache: 'npm'

        - name: install dependencies
          run: npm ci

        - name: build package.json
          run: npm run build
        
        - name: Configure Git user
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        - name: Bump patch version & push to GitHub
          run: |
            npm version patch -m "chore(release): %s [skip ci]"
            

        - name: publish to npm 
          run: npm publish --provenance --access public

        - name: Push version bump & tag to GitHub
          run: git push --follow-tags